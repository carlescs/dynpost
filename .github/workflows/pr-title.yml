name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit on `main`
# that semantic-release reads. Lint it as a conventional commit; the commits
# inside the branch don't reach `main` and aren't checked. This is a separate
# workflow so that editing the title re-runs only this check, not the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Pass the title through an environment variable, never inline it into the script.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
