name: Release

# Push a tag like `v0.1.0` to publish desktop builds to a GitHub release.
# Run manually to produce the same builds as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Photino ships per-platform native libraries, so build each RID on
          # its own operating system.
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Missive.Client/package-lock.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Velopack needs a version of at least 0.0.1.
            version="0.0.1-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Missive.sln -c Release

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Missive.Desktop -c Release
          -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/${{ matrix.rid }}

      - name: Install packaging tools
        shell: bash
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path artifacts/tools
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # vpk needs mksquashfs to build the AppImage.
            sudo apt-get update && sudo apt-get install -y squashfs-tools
          fi

      # Velopack builds the installer, a portable copy and the update feed that installed
      # copies check (releases.<channel>.json), one channel per OS: win, linux, osx.
      - name: Package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=Missive.exe; icon=missive.ico; extra=() ;;
            macOS) exe=Missive; icon=missive.icns; extra=(--bundleId io.github.carlescs.missive) ;;
            Linux) exe=Missive; icon=missive.png; extra=(--categories Development) ;;
          esac
          artifacts/tools/vpk pack \
            --packId Missive \
            --packTitle Missive \
            --packAuthors "${{ github.repository_owner }}" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir "artifacts/publish/${{ matrix.rid }}" \
            --mainExe "$exe" \
            --icon "src/Missive.Desktop/Assets/$icon" \
            --outputDir artifacts/releases \
            "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: missive-${{ matrix.rid }}
          path: artifacts/releases/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Missive $GITHUB_REF_NAME"
          --generate-notes
          $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
