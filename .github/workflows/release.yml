name: Release

# Push a tag like `v0.1.0` to publish desktop builds to a GitHub release.
# Run manually to produce the same builds as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Photino ships per-platform native libraries, so build each RID on
          # its own operating system.
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Missive.Client/package-lock.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Missive.sln -c Release

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Missive.Desktop -c Release
          -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/${{ matrix.rid }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="missive-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          cd artifacts/publish/${{ matrix.rid }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "../../$name.zip" . > /dev/null
            echo "file=artifacts/$name.zip" >> "$GITHUB_OUTPUT"
          else
            # tar keeps the executable bit.
            tar -czf "../../$name.tar.gz" .
            echo "file=artifacts/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: missive-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Missive $GITHUB_REF_NAME"
          --generate-notes
          $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
