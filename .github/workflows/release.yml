name: Release

# Push a tag like `v0.1.0` to publish desktop builds to a GitHub release.
# Run manually to produce the same builds as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Photino ships per-platform native libraries, so build each RID on
          # its own operating system.
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Dynpost.Client/package-lock.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Velopack needs a version of at least 0.0.1.
            version="0.0.1-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Dynpost.sln -c Release

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Dynpost.Desktop -c Release
          -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/${{ matrix.rid }}

      - name: Install packaging tools
        shell: bash
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path artifacts/tools
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # vpk needs mksquashfs to build the AppImage.
            sudo apt-get update && sudo apt-get install -y squashfs-tools
          fi

      # Velopack builds the installer, a portable copy and the update feed that installed
      # copies check (releases.<channel>.json), one channel per OS: win, linux, osx.
      - name: Package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=Dynpost.exe; icon=dynpost.ico; extra=() ;;
            macOS) exe=Dynpost; icon=dynpost.icns; extra=(--bundleId io.github.carlescs.dynpost) ;;
            Linux) exe=Dynpost; icon=dynpost.png; extra=(--categories Development) ;;
          esac
          artifacts/tools/vpk pack \
            --packId Dynpost \
            --packTitle Dynpost \
            --packAuthors "${{ github.repository_owner }}" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir "artifacts/publish/${{ matrix.rid }}" \
            --mainExe "$exe" \
            --icon "src/Dynpost.Desktop/Assets/$icon" \
            --outputDir artifacts/releases \
            "${extra[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: dynpost-${{ matrix.rid }}
          path: artifacts/releases/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Attach only the installers plus the update feed and packages that installed copies
      # download to update themselves; portable copies stay in the workflow artifacts.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/*-Setup.exe dist/*-Setup.pkg dist/*.AppImage)
          feed=(dist/releases.*.json dist/*.nupkg)
          if (( ${#installers[@]} != 3 )); then
            echo "Expected 3 installers, found: ${installers[*]}" >&2
            exit 1
          fi
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${installers[@]}" "${feed[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dynpost $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
