name: Create tag

# Runs semantic-release on every push to the default branch (or manually): it
# derives the next `vMAJOR.MINOR.PATCH` from the conventional commits since the
# last tag and pushes the new tag, which triggers the Release workflow. Tags
# pushed with the default GITHUB_TOKEN don't trigger workflows, so add a
# `RELEASE_TOKEN` secret (a PAT or app token with contents:write) for that to work.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: npx semantic-release
