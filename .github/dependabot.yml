version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/Missive.Client
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      npm:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*']
