<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Dynpost</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D7CFF"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3B2CB8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1E1470" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>

  <!-- Speed lines: the message is on its way -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="36">
    <line x1="168" y1="440" x2="262" y2="440" stroke-opacity="0.9"/>
    <line x1="208" y1="522" x2="262" y2="522" stroke-opacity="0.65"/>
    <line x1="140" y1="604" x2="262" y2="604" stroke-opacity="0.45"/>
  </g>

  <!-- Envelope -->
  <g filter="url(#shadow)">
    <rect x="312" y="336" width="560" height="380" rx="56" fill="url(#paper)"/>
  </g>
  <!-- Lower folds -->
  <path d="M332 694 L540 520 M852 694 L644 520" fill="none" stroke="#C7CCFA"
        stroke-width="22" stroke-linecap="round"/>
  <!-- Flap -->
  <path d="M340 364 L592 566 L844 364" fill="none" stroke="#4F46E5"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
