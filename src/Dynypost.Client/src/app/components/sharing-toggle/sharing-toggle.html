<button
  type="button"
  class="flex size-5 shrink-0 items-center justify-center rounded hover:bg-slate-300 hover:text-slate-800 focus:opacity-100"
  [class]="stateClass()"
  [title]="title()"
  [attr.aria-label]="
    localOnly() ? 'Share ' + name() + ' through git' : 'Keep ' + name() + ' local only'
  "
  [attr.aria-pressed]="localOnly()"
  (click)="$event.stopPropagation(); toggled.emit()"
>
  <fa-icon [icon]="faLaptop" />
</button>
