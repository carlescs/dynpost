<div class="flex gap-2" role="img" [attr.aria-label]="summary()">
  <div
    class="flex h-20 w-14 shrink-0 flex-col justify-between pt-2 text-right text-[10px] text-slate-500"
  >
    <span class="-mt-1.5">{{ threads() }} users</span>
    <span class="-mb-1.5">0</span>
  </div>
  <div class="min-w-0 flex-1">
    <div class="relative h-20 border-b border-slate-300 pt-2">
      <svg class="size-full overflow-visible" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon class="fill-sky-600/15" [attr.points]="shape()" />
        <polyline
          class="fill-none stroke-sky-600"
          stroke-width="2"
          stroke-linejoin="round"
          vector-effect="non-scaling-stroke"
          [attr.points]="outline()"
        />
      </svg>
      @if (ramp() > 0 && ramp() < 100) {
        <div
          class="absolute inset-y-0 border-l border-dashed border-slate-400"
          [style.left.%]="ramp()"
        ></div>
      }
    </div>
    <div class="relative mt-1 h-3.5 text-[10px] text-slate-500">
      <span class="absolute left-0">0</span>
      @if (ramp() > 12 && ramp() < 75) {
        <span class="absolute -translate-x-1/2 whitespace-nowrap" [style.left.%]="ramp()">
          {{ rampUpLabel() }} ramp-up
        </span>
      }
      <span class="absolute right-0 whitespace-nowrap">{{ endLabel() }}</span>
    </div>
  </div>
</div>
