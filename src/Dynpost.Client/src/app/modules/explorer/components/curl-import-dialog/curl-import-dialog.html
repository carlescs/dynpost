<form
  class="adaptive relative w-[36rem] max-w-[calc(100vw-2rem)] rounded-lg border border-slate-300 bg-white p-5 text-sm text-slate-800 shadow-xl"
  (submit)="$event.preventDefault(); open()"
>
  <button
    type="button"
    class="absolute top-2 right-2 flex size-6 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700"
    title="Close"
    aria-label="Close"
    (click)="ref.close()"
  >
    <fa-icon [icon]="faXmark" />
  </button>
  <h2 class="mb-1 text-base font-semibold">New request from cURL</h2>
  <p class="mb-3 text-xs text-slate-500">
    Paste a <code>curl</code> command (bash, cmd or PowerShell quoting). Its method, URL, headers,
    auth and body open as a new request; options Dynpost can't represent are listed. You can also
    paste a command straight into a request's URL field.
  </p>
  <textarea
    class="h-40 w-full rounded border border-slate-300 p-2 font-mono text-xs focus:border-sky-500 focus:outline-none"
    aria-label="cURL command"
    placeholder="curl https://api.example.com/users -H 'Accept: application/json'"
    spellcheck="false"
    [value]="command()"
    (input)="command.set($any($event.target).value)"
  ></textarea>
  <div class="mt-3 flex justify-end gap-2">
    <button
      type="button"
      class="rounded border border-slate-300 px-3 py-1 hover:bg-slate-100"
      (click)="ref.close()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="rounded bg-sky-600 px-3 py-1 text-white hover:bg-sky-700 disabled:opacity-50"
      [disabled]="!command().trim() || busy()"
    >
      Open request
    </button>
  </div>
</form>
