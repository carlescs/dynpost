@if (rows().length) {
  <section class="mt-4 text-sm" aria-label="Inherited variables">
    <h3 class="mb-1 text-xs font-medium tracking-wide text-slate-500 uppercase">
      Inherited from folders
    </h3>
    <table class="w-full table-fixed border-collapse">
      <tbody>
        @for (row of rows(); track row.name) {
          <tr class="border-b border-slate-100 text-slate-500" [class.line-through]="row.replaced">
            <td class="w-1/3 truncate py-1 pr-2 font-mono" [title]="row.name">{{ row.name }}</td>
            <td class="truncate py-1 pr-2 font-mono" [title]="row.value">{{ row.value }}</td>
            <td class="w-48 py-1 text-right no-underline">
              <button
                type="button"
                class="inline-flex max-w-full items-center gap-1 truncate rounded px-1 text-xs text-sky-700 hover:bg-sky-50"
                [title]="
                  row.replaced
                    ? 'Replaced by a variable set here. Open the settings of ' + row.folder
                    : 'Open the settings of ' + row.folder
                "
                (click)="folders.open(row.folder)"
              >
                <fa-icon [icon]="faFolderOpen" />{{ folders.nameOf(row.folder) }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>
}
