<div class="mb-1.5 flex items-center gap-2">
  <input
    type="checkbox"
    class="ml-3.5 accent-sky-600"
    [title]="allChosen() ? 'Deselect every run' : 'Select every run'"
    [attr.aria-label]="allChosen() ? 'Deselect every run' : 'Select every run'"
    [checked]="allChosen()"
    [indeterminate]="chosen().length > 0 && !allChosen()"
    data-check-all
    (change)="toggleAll()"
  />
  @if (chosen().length) {
    <h3 class="flex-1 text-xs font-semibold tracking-wide text-slate-500 uppercase">
      {{ chosen().length }} selected
    </h3>
    <button
      type="button"
      class="rounded px-1.5 py-0.5 text-xs text-slate-500 hover:bg-slate-200"
      title="Deselect every run"
      data-deselect
      (click)="deselect()"
    >
      Deselect
    </button>
    <button
      type="button"
      class="flex items-center gap-1 rounded px-1.5 py-0.5 text-xs text-rose-700 hover:bg-rose-50"
      title="Delete the selected runs"
      data-delete-selected
      (click)="removeChosen()"
    >
      <fa-icon [icon]="faTrash" /> Delete
    </button>
  } @else {
    <h3 class="flex-1 text-xs font-semibold tracking-wide text-slate-500 uppercase">History</h3>
    <button
      type="button"
      class="rounded px-1.5 py-0.5 text-xs text-slate-500 hover:bg-slate-200 hover:text-rose-700"
      title="Delete every saved run of this plan"
      data-clear
      (click)="clear.emit()"
    >
      Clear
    </button>
  }
</div>
<ul class="divide-y divide-slate-200 overflow-hidden rounded-lg border border-slate-200 bg-white">
  @for (row of rows(); track row.run.runId) {
    <li
      class="group flex items-stretch border-l-2"
      [class]="selected() === row.run.runId ? 'border-sky-600 bg-sky-50' : 'border-transparent'"
    >
      <label class="flex shrink-0 cursor-pointer items-center pl-3 hover:bg-slate-50">
        <input
          type="checkbox"
          class="accent-sky-600"
          [attr.aria-label]="'Select the run from ' + dates.dateTime(row.run.startedAt)"
          [checked]="row.checked"
          data-check
          (click)="toggle(row.run.runId, $event)"
        />
      </label>
      <button
        type="button"
        class="flex min-w-0 flex-1 items-center gap-3 px-3 py-1.5 text-left text-xs hover:bg-slate-50"
        [attr.aria-current]="selected() === row.run.runId ? 'true' : null"
        data-select
        (click)="select.emit(row.run.runId)"
      >
        <fa-icon class="text-sm" [class]="row.color" [icon]="row.icon" [title]="row.label" />
        <span class="min-w-0 flex-1">
          <span class="block truncate font-medium">
            {{ dates.dateTime(row.run.startedAt) }}
          </span>
          <span class="block truncate text-slate-500">
            {{ row.label }} · {{ row.run.samples | number }} requests in
            {{ formatElapsed(row.run.elapsedMs) }}
          </span>
        </span>
        <span class="w-16 shrink-0 text-right">
          <span class="block font-medium">{{ row.run.errorPercent | number: '1.0-1' }}%</span>
          <span class="block text-slate-500">errors</span>
        </span>
        <span class="w-24 shrink-0">
          <span class="flex items-baseline justify-between">
            <span class="text-slate-500">p95</span>
            <span class="font-medium">{{ formatMs(row.run.p95) }}</span>
          </span>
          <span class="mt-0.5 block h-1 rounded-full bg-slate-100">
            <span
              class="block h-1 min-w-1 rounded-full bg-sky-600"
              [style.width.%]="row.bar"
            ></span>
          </span>
        </span>
      </button>
      <button
        type="button"
        class="flex w-8 shrink-0 items-center justify-center text-xs text-slate-400 opacity-0 group-hover:opacity-100 hover:bg-slate-100 hover:text-rose-700 focus-visible:opacity-100"
        title="Delete this run"
        aria-label="Delete this run"
        data-delete
        (click)="remove.emit([row.run.runId])"
      >
        <fa-icon [icon]="faTrash" />
      </button>
    </li>
  }
</ul>
