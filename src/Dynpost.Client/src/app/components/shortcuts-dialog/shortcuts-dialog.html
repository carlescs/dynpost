<div
  class="adaptive relative w-[32rem] max-w-[calc(100vw-2rem)] rounded-lg border border-slate-300 bg-white p-5 text-sm text-slate-800 shadow-xl"
>
  <button
    type="button"
    class="absolute top-2 right-2 flex size-6 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700"
    title="Close"
    aria-label="Close"
    (click)="ref.close()"
  >
    <fa-icon [icon]="faXmark" />
  </button>
  <h2 id="shortcuts-title" class="mb-4 text-base font-semibold">Keyboard shortcuts</h2>
  <dl class="grid grid-cols-[1fr_auto] items-stretch">
    @for (shortcut of shortcuts; track shortcut.action) {
      <dt class="flex items-center border-b border-slate-100 py-1.5 pr-4">{{ shortcut.label }}</dt>
      <dd
        class="flex flex-wrap items-center justify-end gap-x-1.5 gap-y-1 border-b border-slate-100 py-1.5 text-slate-600"
      >
        @for (combo of shortcut.keys; track $index) {
          @if (!$first) {
            <span class="text-xs text-slate-400">or</span>
          }
          <app-key-combo [combo]="combo" />
        }
      </dd>
    }
  </dl>
</div>
