<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  (click)="$event.target === $event.currentTarget && closed.emit()"
>
  <div
    class="adaptive relative w-96 rounded border border-slate-300 bg-white p-5 text-sm text-slate-800 shadow-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="about-title"
  >
    <button
      type="button"
      class="absolute top-2 right-2 flex size-6 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700"
      title="Close"
      aria-label="Close"
      (click)="closed.emit()"
    >
      <fa-icon [icon]="faXmark" />
    </button>
    <div class="mb-4 flex items-center gap-3">
      <fa-icon class="text-3xl text-sky-500" [icon]="faPaperPlane" />
      <div>
        <h2 id="about-title" class="text-base font-semibold">Missive</h2>
        <p class="text-xs text-slate-500">A simple, file-based HTTP client.</p>
      </div>
    </div>
    @if (info(); as about) {
      <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
        <dt class="text-slate-500">Version</dt>
        <dd data-testid="about-version" class="break-words">{{ about.version }}</dd>
        <dt class="text-slate-500">Runtime</dt>
        <dd class="break-words">{{ about.runtime }}</dd>
        <dt class="text-slate-500">System</dt>
        <dd class="break-words">{{ about.operatingSystem }}</dd>
      </dl>
    } @else if (failed()) {
      <p class="text-rose-700">Could not read the version information.</p>
    } @else {
      <p class="text-slate-500">Loading…</p>
    }
  </div>
</div>
