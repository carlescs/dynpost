<fa-icon class="text-sky-400" [icon]="faPaperPlane" />
<span class="text-sm font-semibold tracking-wide text-white">Missive</span>
@if (store.workspace(); as workspace) {
  <span class="text-sm text-slate-400" aria-hidden="true">—</span>
  <button
    type="button"
    class="flex min-w-0 items-center gap-1.5 rounded px-1 text-sm text-slate-400 hover:text-white hover:underline"
    [title]="revealLabel + ' (' + workspace.root + ')'"
    [attr.aria-label]="revealLabel + ': ' + workspace.name"
    (click)="store.revealFolder()"
  >
    <span class="truncate">{{ workspace.name }}</span>
    <fa-icon class="shrink-0 text-xs" [icon]="faArrowUpRightFromSquare" />
  </button>
}
<div class="ml-auto flex items-center gap-1">
  @if (updates.readyVersion(); as version) {
    <button
      type="button"
      class="flex items-center gap-2 rounded bg-emerald-600 px-2 py-1 text-sm text-white hover:bg-emerald-500 disabled:opacity-50"
      [title]="'Missive ' + version + ' is ready. Restart to install it.'"
      [disabled]="updates.restarting()"
      (click)="updates.restart()"
    >
      <fa-icon [icon]="faCircleArrowUp" /> Restart to update
    </button>
  }
  @if (store.workspace()) {
    <label
      class="flex items-center gap-2 rounded px-2 py-1 text-sm text-slate-300"
      title="The environment whose variables requests are sent with"
    >
      <fa-icon [icon]="faLayerGroup" />
      <span class="sr-only">Environment</span>
      <select
        class="max-w-48 rounded border border-slate-600 bg-slate-800 px-1.5 py-0.5 text-sm text-white focus:border-sky-500 focus:outline-none"
        aria-label="Environment"
        [value]="environments.activeId() ?? ''"
        (change)="environments.select($any($event.target).value || null)"
      >
        <option value="" [selected]="!environments.activeId()">No environment</option>
        @for (env of environments.environments(); track env.id) {
          <option
            [value]="env.id"
            [disabled]="!!env.error"
            [selected]="env.id === environments.activeId()"
          >
            {{ env.name }}
          </option>
        }
      </select>
    </label>
  }
  <div #recentMenu class="relative">
    <div
      class="flex items-stretch rounded border border-slate-600"
      role="group"
      aria-label="Workspace"
    >
      <button
        type="button"
        class="flex items-center px-2 py-1 text-sm text-slate-300 hover:bg-slate-700 hover:text-white disabled:opacity-50"
        [class.rounded]="!otherRecent().length"
        [class.rounded-l]="otherRecent().length"
        title="Open workspace folder"
        aria-label="Open workspace folder"
        [disabled]="store.opening()"
        (click)="store.openFolder()"
      >
        <fa-icon [icon]="faFolderOpen" />
      </button>
      @if (otherRecent().length) {
        <button
          type="button"
          class="flex items-center gap-2 rounded-r border-l border-slate-600 px-2 py-1 text-sm text-white hover:bg-slate-700 disabled:opacity-50"
          title="Switch to a recent workspace"
          aria-label="Recent workspaces"
          aria-controls="recent-panel"
          [attr.aria-expanded]="recentOpen()"
          [disabled]="store.opening()"
          (click)="toggleRecent()"
        >
          Recent workspaces <fa-icon class="text-xs text-slate-400" [icon]="faChevronDown" />
        </button>
      }
    </div>
    @if (recentOpen()) {
      <div
        id="recent-panel"
        role="menu"
        aria-label="Recent workspaces"
        class="adaptive absolute top-full right-0 z-50 mt-1 w-72 rounded border border-slate-300 bg-white py-1 text-sm text-slate-800 shadow-lg"
      >
        @for (recent of otherRecent(); track recent.path) {
          <div class="flex min-w-0 items-center hover:bg-slate-100" role="none">
            <button
              type="button"
              role="menuitem"
              class="flex min-w-0 flex-1 flex-col px-3 py-1.5 text-left"
              [title]="recent.path"
              (click)="openRecent(recent.path)"
            >
              <span class="truncate">{{ recent.name }}</span>
              <span class="truncate text-xs text-slate-500">{{ recent.path }}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="mr-1 flex size-7 shrink-0 items-center justify-center rounded text-slate-400 hover:bg-slate-200 hover:text-rose-600"
              [attr.aria-label]="'Remove ' + recent.name + ' from recent workspaces'"
              [title]="'Remove ' + recent.name + ' from recent workspaces'"
              (click)="store.removeRecent(recent.path)"
            >
              <fa-icon [icon]="faXmark" />
            </button>
          </div>
        }
      </div>
    }
  </div>
  <div class="relative">
    <button
      type="button"
      class="flex size-7 items-center justify-center rounded text-slate-300 hover:bg-slate-700 hover:text-white"
      title="Settings"
      aria-label="Settings"
      aria-controls="settings-panel"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <fa-icon [icon]="faGear" />
    </button>
    @if (menuOpen()) {
      <div
        id="settings-panel"
        class="adaptive absolute top-full right-0 z-50 mt-1 w-56 rounded border border-slate-300 bg-white py-1 text-sm text-slate-800 shadow-lg"
      >
        <button
          type="button"
          class="flex w-full items-center gap-2 px-3 py-1.5 text-left hover:bg-slate-100"
          role="switch"
          [attr.aria-checked]="theme.isDark()"
          (click)="theme.setDark(!theme.isDark())"
        >
          <fa-icon class="w-4 text-slate-500" [icon]="faMoon" />
          <span class="flex-1">Dark mode</span>
          <span
            class="relative h-4 w-7 shrink-0 rounded-full transition-colors"
            [class]="theme.isDark() ? 'bg-sky-600' : 'bg-slate-300'"
            aria-hidden="true"
          >
            <span
              class="absolute top-0.5 left-0.5 size-3 rounded-full bg-[#fff] shadow transition-transform"
              [class.translate-x-3]="theme.isDark()"
            ></span>
          </span>
        </button>
        <button
          type="button"
          class="flex w-full items-center gap-2 px-3 py-1.5 text-left hover:bg-slate-100"
          (click)="showAbout()"
        >
          <fa-icon class="w-4 text-slate-500" [icon]="faCircleInfo" />
          <span class="flex-1">About Missive</span>
        </button>
      </div>
    }
  </div>
</div>
