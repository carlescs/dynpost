<div
  class="adaptive relative w-[28rem] max-w-[calc(100vw-2rem)] rounded-lg border border-slate-300 bg-white p-5 text-sm text-slate-800 shadow-xl"
>
  <button
    type="button"
    class="absolute top-2 right-2 flex size-6 items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700"
    title="Close"
    aria-label="Close"
    (click)="ref.close()"
  >
    <fa-icon [icon]="faXmark" />
  </button>
  <h2 id="shortcuts-title" class="mb-4 text-base font-semibold">Keyboard shortcuts</h2>
  <dl class="grid grid-cols-[1fr_auto] gap-x-4 gap-y-1.5">
    @for (shortcut of shortcuts; track shortcut.action) {
      <dt>{{ shortcut.label }}</dt>
      <dd class="flex flex-wrap justify-end gap-1">
        @for (combo of shortcut.keys; track $index) {
          <kbd
            class="rounded border border-slate-300 bg-slate-50 px-1.5 font-mono text-xs text-slate-600"
            >{{ format(combo) }}</kbd
          >
        }
      </dd>
    }
  </dl>
</div>
