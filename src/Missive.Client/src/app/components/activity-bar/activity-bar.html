<div
  class="flex flex-col items-center gap-1"
  cdkDropList
  cdkDropListLockAxis="y"
  (cdkDropListDropped)="drop($event)"
>
  @for (item of items(); track item.view; let i = $index) {
    <button
      type="button"
      class="relative flex size-10 items-center justify-center rounded-md text-lg text-slate-400 hover:text-white [&.cdk-drag-placeholder]:opacity-30"
      [class.text-white]="isActive(item.view)"
      [attr.aria-label]="item.label"
      [attr.aria-pressed]="isActive(item.view)"
      [attr.aria-keyshortcuts]="'Alt+ArrowUp Alt+ArrowDown'"
      [attr.data-activity]="item.view"
      [title]="item.label + ' (drag, or Alt+Up/Down, to reorder)'"
      cdkDrag
      [cdkDragPreviewClass]="previewClasses"
      (cdkDragEnded)="dragEnded()"
      (click)="show(item.view)"
      (keydown)="onKeydown($event, i)"
    >
      @if (isActive(item.view)) {
        <span class="absolute inset-y-1 -left-1 w-0.5 rounded bg-sky-400"></span>
      }
      <fa-icon [icon]="item.icon" />
      @if (item.view === 'git' && git.changeCount()) {
        <span
          class="absolute right-0.5 bottom-0.5 min-w-4 rounded-full bg-sky-500 px-1 text-[10px] leading-4 text-white"
        >
          {{ git.changeCount() }}
        </span>
      }
    </button>
  }
</div>
