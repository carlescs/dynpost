<div
  class="adaptive flex w-[28rem] max-w-[calc(100vw-2rem)] gap-3 rounded-lg border border-slate-300 bg-white p-5 text-sm text-slate-800 shadow-xl"
>
  @if (data.danger) {
    <fa-icon class="mt-0.5 text-lg text-rose-500" [icon]="faTriangleExclamation" />
  }
  <div class="min-w-0 flex-1">
    <h2 id="confirm-dialog-title" class="mb-2 text-base font-semibold">
      {{ data.title ?? 'Are you sure?' }}
    </h2>
    <p
      id="confirm-dialog-message"
      data-testid="confirm-message"
      class="break-words whitespace-pre-line text-slate-600"
    >
      {{ data.message }}
    </p>
    <div class="mt-5 flex justify-end gap-2">
      <button
        type="button"
        data-testid="confirm-cancel"
        class="rounded border border-slate-300 bg-white px-3 py-1 hover:bg-slate-100"
        (click)="ref.close(false)"
      >
        {{ data.cancelLabel ?? 'Cancel' }}
      </button>
      <button
        type="button"
        data-testid="confirm-ok"
        class="rounded px-3 py-1 text-white"
        [class]="data.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-sky-600 hover:bg-sky-700'"
        (click)="ref.close(true)"
      >
        {{ data.confirmLabel ?? 'OK' }}
      </button>
    </div>
  </div>
</div>
