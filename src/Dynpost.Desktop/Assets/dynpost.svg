<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Dynpost</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2E1F9E"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="820" y1="220" x2="480" y2="680">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#160D5C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>

  <!-- Trail: the request is on its way -->
  <path d="M170 800 C 270 650, 380 770, 470 640" fill="none" stroke="#FFFFFF"
        stroke-width="36" stroke-linecap="round" stroke-dasharray="1 68" stroke-opacity="0.65"/>

  <!-- Paper plane -->
  <g filter="url(#shadow)">
    <path d="M820 220 L250 470 L470 560 Z" fill="#FFFFFF"/>
    <path d="M820 220 L470 560 L560 790 Z" fill="#E4E7FF"/>
    <path d="M820 220 L470 560 L520 670 Z" fill="url(#accent)"/>
  </g>
</svg>
